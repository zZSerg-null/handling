# КОНФИГУРАЦИЯ КЛАВИАТУР
#
# ВЗАИМОДЕЙСТВИЕ С КОМПОНЕНТАМИ:
#
#    - Поле 'callback' в кнопках должно соответствовать enum CallbackNames
#    - Пример: callback: QUEST_MENU → CallbackNames.QUEST_MENU
#    - При маппинге yaml -> ResponseKeyboardButton элемент указанный как колбэк
#        и не найденный в CallbackNames выбросит исключение
#
#    - KeyboardRegistry парсит этот файл и создает ResponseKeyboardButton
#    - Поддерживает типы: INLINE, REPLY_ADD, REPLY_REMOVE
#
#    - Каждый MenuDefinition ссылается на клавиатуру по yamlKey
#    - Пример: USER_MAIN_MENU → user_main_menu
#
# СТРУКТУРА КЛАВИАТУРЫ:
#   type: INLINE|REPLY_ADD|REPLY_REMOVE
#   rows: список строк кнопок
#     - text: отображаемый текст
#     - callback: enum из CallbackNames (опционально)
#     - webAppUrl: URL для WebApp (опционально)


#Клавиатуры, используемые в приложении:

keyboards:

  #-------------------UserMessageActionDispatcher
  user_main_menu:
    type: "INLINE"
    rows:
      - - text: "📋 Мои квесты"
          callback: QUEST_MENU
        - text: "👤 Мой аккаунт"
          callback: ACCOUNT



  #-------------------UserCallbackActionDispatcher
  quest_menu:
    type: "INLINE"
    rows:
      - - text: "📋 Создать квест"
          callback: CREATE_NEW_QUEST
      - - text: "👤 Список квестов"
          callback: QUEST_LIST
      - - text: "👤 Запущенные"
          callback: RUNNING
      - - text: "🔙 Назад"
          callback: BACK




  account_menu:
    type: "INLINE"
    rows:
      - - text: "Моя статистика"
          callback: MY_STATISTIC
      - - text: "🔙 Назад"
          callback: BACK



  create_new_quest:
    type: "INLINE"
    rows:
      - - text: "Начать создание"
          callback: START_CREATION
        - text: "🔙 Назад"
          callback: BACK


  start_creation:
    type: "REPLY_ADD"
    rows:
      - - text: "📋 Создать квест"
          webAppUrl: https://miniapp2-drab.vercel.app # https://miniapp-six-pi.vercel.app/
      - - text: "Завершить создание"




  admin_panel:
    type: "INLINE"
    rows:
      - - text: "👥 Пользователи"
          callback: ADMIN_USERS
        - text: "⚙️ Управление"
          callback: ADMIN_MANAGEMENT


  #-------------------PlayerMesageActionDispatcher
  #-------------------PlayerCallbackActionDispatcher
  #-------------------PlayerPollAnswerActionDispatcher

  #-------------------AdminMessageActionDispatcher
  #-------------------AdminCallbackActionDispatcher

  #-------------------CreatorMessageActionDispatcher
  #-------------------CreatorCallbackActionDispatcher
  #-------------------CreatorLocationActionDispatcher
  #-------------------CreatorPollActionDispatcher

  remove_reply:
    type: "REPLY_REMOVE"
    rows:
      - - text: "❌ Отмена"

  # Reply клавиатуры (без callback)
  main_reply:
    type: "REPLY_ADD"
    rows:
      - - text: "📝 Регистрация"
      - - text: "ℹ️ Информация"
        - text: "📞 Поддержка"
      - - text: "⚙️ Настройки"

  auth_menu:
    type: "REPLY_ADD"
    rows:
      - - text: "🔐 Войти"
        - text: "📝 Зарегистрироваться"
      - - text: "🆘 Забыли пароль?"
